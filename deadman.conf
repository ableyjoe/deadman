# deadman.conf(5): the checks that deadman(8) watches.
#
# One check per line: its name; the token in its ping URL, which
# "deadman token" makes; how often it should ping (s, m, h, d or w); how
# much longer to wait before calling it down; and where to send mail.
# The tokens are the keys to the ping URLs, so only deadman(8), which
# runs as _deadman, should read this file: owner root, group _deadman,
# mode 0640.
#
# name			token				period	grace	mailto
#nightly-backup		0123456789abcdef0123456789abcdef	1d	1d	root
